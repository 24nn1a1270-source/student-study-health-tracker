{% extends "base.html" %}

{% block content %}
    <div class="card">
        <h2>💧 Log Water Intake</h2>
        <form method="POST">
            <label>Glasses of Water</label>
            <input type="number" name="glasses" placeholder="e.g. 8" required>

            <label>Date</label>
            <input type="date" name="date" required>

            <br><br>
            <button type="submit" class="btn">Add Log</button>
        </form>
    </div>

    <div class="card">
        <h2>📊 Water History</h2>
        {% if logs %}
            {% for log in logs %}
                <p><strong>{{ log['date'] }}</strong> — {{ log['glasses'] }} glasses 💧</p>
            {% endfor %}
        {% else %}
            <p>No water logs yet. Add your first one above!</p>
        {% endif %}
    </div>
{% endblock %}
